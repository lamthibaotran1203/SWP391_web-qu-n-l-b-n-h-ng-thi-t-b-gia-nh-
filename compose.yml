services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: household_goods
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d household_goods"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - household_goods_pgdata:/var/lib/postgresql/data
      - ./scripts/docker:/docker-entrypoint-initdb.d:ro

volumes:
  household_goods_pgdata:
