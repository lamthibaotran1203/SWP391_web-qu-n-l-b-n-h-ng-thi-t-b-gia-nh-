spring:
  application:
    name: household-goods-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    enabled: true
    create-schemas: true
    default-schema: app
    schemas: app
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
        jdbc:
          time_zone: UTC
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLED:true}
            required: ${SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  servlet:
    session:
      timeout: ${SERVER_SERVLET_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}

  mail:
    from-email: ${MAIL_FROM_EMAIL:}
    from-name: ${MAIL_FROM_NAME:Gia Dá»¥ng Viá»‡t}

  bootstrap-manager:
    email: ${BOOTSTRAP_MANAGER_EMAIL:}
    password: ${BOOTSTRAP_MANAGER_PASSWORD:}
    full-name: ${BOOTSTRAP_MANAGER_FULL_NAME:}
